name: formula-ai-observability
services:
  grafana:
    image: grafana/grafana:12.3.0
    ports: ['127.0.0.1:3300:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_VIEWERS_CAN_EDIT: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/overview.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 384m
    restart: unless-stopped
  loki-init:
    image: ubuntu:22.04
    user: '0:0'
    network_mode: none
    command: ['chown', '10001:10001', '/loki']
    volumes: ['loki_data:/loki']
    cap_drop: [ALL]
    cap_add: [CHOWN]
  loki:
    depends_on:
      loki-init:
        condition: service_completed_successfully
    image: grafana/loki:3.6.0
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    mem_limit: 384m
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.9.0
    command: ['-config.file=/etc/tempo/config.yaml']
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    mem_limit: 384m
    restart: unless-stopped
  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.34.2
    profiles: [alerts]
    command:
      [
        '--config.file=/etc/alertmanager/config.yaml',
        '--storage.path=/alertmanager',
        '--web.external-url=http://127.0.0.1:9093',
      ]
    ports: ['127.0.0.1:9093:9093']
    volumes:
      - ./tmp/observability-secrets/alertmanager.yaml:/etc/alertmanager/config.yaml:ro
      - alertmanager_data:/alertmanager
    secrets: [qq-smtp-password]
    mem_limit: 128m
    restart: unless-stopped
  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    mem_limit: 384m
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.11.3
    command:
      [
        'run',
        '--server.http.listen-addr=0.0.0.0:12345',
        '--storage.path=/var/lib/alloy',
        '/etc/alloy/config.alloy',
      ]
    ports: ['127.0.0.1:4318:4318']
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - ./tmp/observability:/logs:ro
      - alloy_data:/var/lib/alloy
    depends_on: [loki, tempo]
    mem_limit: 256m
    restart: unless-stopped
volumes:
  grafana_data:
  loki_data:
  tempo_data:
  alloy_data:
  prometheus_data:
  alertmanager_data:

secrets:
  qq-smtp-password:
    file: ./tmp/observability-secrets/qq-smtp-password
