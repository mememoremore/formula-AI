# Replaces the reviewed pzadmin site; certificates stay on the server.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ideal-formula.top www.ideal-formula.top;
    return 308 https://www.ideal-formula.top$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ideal-formula.top;
    ssl_certificate /etc/nginx/ssl/ideal-formula.top/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/ideal-formula.top/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://www.ideal-formula.top$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ideal-formula.top;
    ssl_certificate /etc/nginx/ssl/ideal-formula.top/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/ideal-formula.top/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 11m;
    client_body_timeout 30s;
    location = /api/metrics { return 404; }
    location / {
      proxy_pass http://127.0.0.1:13000;
      proxy_http_version 1.1;
      proxy_set_header Host www.ideal-formula.top;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host www.ideal-formula.top;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Formula-Client-IP "";
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

}
