# Include INSIDE the existing www.ideal-formula.top HTTPS server block.
# Existing host Nginx retains certificate ownership and TLS configuration.
client_max_body_size 11m;
client_body_timeout 30s;
location = /api/metrics { return 404; }
location / {
  proxy_pass http://127.0.0.1:13000;
  proxy_http_version 1.1;
  proxy_set_header Host www.ideal-formula.top;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host www.ideal-formula.top;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Formula-Client-IP "";
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
}
