global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: formula-api
    scrape_timeout: 5s
    metrics_path: /api/metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
  - job_name: formula-worker
    scrape_timeout: 5s
    static_configs:
      - targets: ['host.docker.internal:9464']
  - job_name: formula-recognition
    scrape_timeout: 5s
    static_configs:
      - targets: ['host.docker.internal:8001']

rule_files: [/etc/prometheus/alerts.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
